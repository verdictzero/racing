# Local development stack. Everything here is self-hosted on purpose: this is the same shape the
# air-gapped deployment runs, so "works on my machine" and "works on the closed network" are the
# same configuration with different hostnames. Nothing in the app talks to a managed service.
#
#   docker compose up -d      then    pnpm db:migrate && pnpm dev
#
# Keycloak seeds a realm from ops/keycloak/raci-realm.json with two users (see the README), so a
# fresh clone can complete a login without anyone provisioning an IdP first.

services:
  postgres:
    image: postgres:16-alpine
    container_name: raci-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: raci
      POSTGRES_PASSWORD: raci_dev_password
      POSTGRES_DB: raci
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U raci -d raci']
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: raci-keycloak
    restart: unless-stopped
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
    ports:
      - '8080:8080'
    volumes:
      - ./ops/keycloak:/opt/keycloak/data/import:ro

  # An OpenLDAP standing in for Active Directory, so the LDAP directory adapter can be developed
  # and tested without a domain controller. Seeded with the same six-directorate shape the demo
  # dataset uses, which makes the sync reconciliation testable end to end.
  openldap:
    image: bitnami/openldap:2.6
    container_name: raci-openldap
    restart: unless-stopped
    environment:
      LDAP_ROOT: dc=asic,dc=army,dc=mil
      LDAP_ADMIN_USERNAME: admin
      LDAP_ADMIN_PASSWORD: ldap_dev_password
      LDAP_SKIP_DEFAULT_TREE: 'yes'
      LDAP_CUSTOM_LDIF_DIR: /ldifs
    ports:
      - '1389:1389'
    volumes:
      - ./ops/ldap:/ldifs:ro

volumes:
  postgres-data:
